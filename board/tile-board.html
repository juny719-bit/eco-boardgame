<title>기록 타일 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&display=swap">
<style>
:root{
  --ink:#2a2721; --paper:#eeeae0; --muted:#6f6a5c; --line:#d6d0c0; --surface:#fffdf7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--ink:#efeadc;--paper:#17160f;--muted:#a29a86;--line:#3a3529;--surface:#221f17}
}
:root[data-theme="dark"]{--ink:#efeadc;--paper:#17160f;--muted:#a29a86;--line:#3a3529;--surface:#221f17}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Gothic A1","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6;
  padding-inline:20px;padding-block:26px 48px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:900;margin:0;letter-spacing:-.02em;line-height:1.15}
.intro{margin:0;color:var(--muted);font-size:.92rem;max-width:62ch}
.board{width:100%;display:block;box-shadow:0 2px 22px rgba(0,0,0,.13);background:#fff}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;
  border-top:1px solid var(--line);padding-top:16px}
.meta section{display:flex;flex-direction:column;gap:3px}
.meta h2{margin:0;font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.meta p{margin:0;font-size:.86rem}
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff;padding:0}
  .wrap{max-width:none;gap:0}
  .eyebrow,h1,.intro,.meta{display:none}
  .board{width:210mm;height:297mm;box-shadow:none}
}
</style>

<div class="wrap">
  <div>
    <div class="eyebrow">환경아카이브 풀숲 · 보드게임</div>
    <h1>기록 타일</h1>
  </div>
  <p class="intro">시안 B를 인쇄용으로 다듬었습니다. A4 세로 한 장에 보드·규칙·카드 자리가 모두 들어갑니다. 규칙은 한 문장이고, 보드에 직접 인쇄되어 있어 설명서가 따로 필요 없습니다. 브라우저에서 인쇄하면 A4 한 면으로 나옵니다.</p>

  <svg class="board" viewBox="0 0 794 1123" role="img" aria-label="기록 타일 보드 - A4 인쇄용"></svg>

  <div class="meta">
    <section><h2>인원 · 시간</h2><p>2–4인 · 한 판 15분</p></section>
    <section><h2>구성물</h2><p>보드 1장 · 사건 카드 45장</p></section>
    <section><h2>규칙</h2><p>카드를 뒤집어 어느 주제인지 맞히고 타일에 올린다</p></section>
    <section><h2>인쇄</h2><p>A4 무광 250g 이상 · 카드는 별도 63×88mm</p></section>
  </div>
</div>

<script>
const SUBJ=["생태계보전","반핵탈핵","생활안전","기후에너지","반공해","일반(정치·제도)","자원순환","대기오염","미분류"];
const CNT={"생태계보전":19,"반핵탈핵":9,"생활안전":7,"기후에너지":3,"반공해":2,"일반(정치·제도)":2,"자원순환":1,"대기오염":1,"미분류":1};
const CORE={"생태계보전":"#2f6f4e","반핵탈핵":"#6f9a63","생활안전":"#b05a6c","기후에너지":"#c79a35","반공해":"#d1603f","일반(정치·제도)":"#c8823d","자원순환":"#655389","대기오염":"#4e8fa3","미분류":"#8a8371"};
const TINT={"생태계보전":"#dbeddd","반핵탈핵":"#e8efdc","생활안전":"#f7e3e7","기후에너지":"#fbf0d4","반공해":"#fbe1d6","일반(정치·제도)":"#fdeedc","자원순환":"#e7e1f0","대기오염":"#dcebf1","미분류":"#eceade"};
const ROMA={"생태계보전":"ECOSYSTEM","반핵탈핵":"ANTI-NUCLEAR","생활안전":"DAILY SAFETY","기후에너지":"CLIMATE","반공해":"ANTI-POLLUTION","일반(정치·제도)":"POLICY","자원순환":"CIRCULAR","대기오염":"AIR QUALITY","미분류":"UNCLASSIFIED"};
const ICON={
 "생태계보전":'<path d="M12 21.5V11.2"/><path d="M12 11.2C12 6.2 8.2 3 3.8 3c0 5 3.8 8.2 8.2 8.2z"/><path d="M12 11.2C12 6.6 15.7 4.1 19.6 4.1c0 4.6-3.7 7.1-7.6 7.1z"/>',
 "반핵탈핵":'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.3"/><path d="M12 9.7V3.6"/><path d="M14 13.2l5.3 3"/><path d="M10 13.2l-5.3 3"/>',
 "생활안전":'<path d="M12 3.2l7.4 3.1v5.5c0 4.5-3 7.9-7.4 9.1-4.4-1.2-7.4-4.6-7.4-9.1V6.3z"/><path d="M9.3 12.1l2 2.1 3.5-4.1"/>',
 "기후에너지":'<circle cx="12" cy="12" r="3.9"/><path d="M12 2.7v2.3M12 19v2.3M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.7 12H5M19 12h2.3M4.4 19.6L6 18M18 6l1.6-1.6"/>',
 "반공해":'<path d="M3.2 20.6h17.6"/><path d="M6 20.6V9.4h4.1v11.2"/><path d="M14 20.6V4.6h4.1v16"/><path d="M8 6.6q1.9-2.1 0-4.2"/><path d="M16 2.2q1.9-2.1 0-4.2" transform="translate(0,2)"/>',
 "일반(정치·제도)":'<path d="M3.6 20.6h16.8"/><path d="M6.2 20.6V10.4M10.1 20.6V10.4M13.9 20.6V10.4M17.8 20.6V10.4"/><path d="M3.6 10.4h16.8"/><path d="M12 3.2l8.4 7.2H3.6z"/>',
 "자원순환":'<path d="M4.5 9.8A8 8 0 0 1 18.4 7.5"/><path d="M19.5 14.2A8 8 0 0 1 5.6 16.5"/><path d="M18.7 3.4v4.3h-4.3"/><path d="M5.3 20.6v-4.3h4.3"/>',
 "대기오염":'<path d="M7.2 15.6a3.9 3.9 0 0 1 .5-7.7 5.3 5.3 0 0 1 10 1.4 3.3 3.3 0 0 1-.8 6.3z"/><path d="M4.6 19.2h6M13.2 19.2h6.2M7.6 22h9"/>',
 "미분류":'<path d="M8.4 9.1a3.7 3.7 0 0 1 7.3.6c0 1.3-.6 2-1.6 2.8-1 .7-2.1 1.5-2.1 3.3v.8"/><circle cx="12" cy="20.2" r="1"/>'
};
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

let s='<rect width="794" height="1123" fill="#faf5ea"/>';

/* ── 재단 여백 안쪽 가이드 ── */
s+='<rect x="30" y="30" width="734" height="1050" fill="none" stroke="#e2d9c4" stroke-width="1.2"/>';

/* ── 머리글 ── */
s+='<text x="397" y="96" text-anchor="middle" font-family="Gothic A1,sans-serif" font-size="46" font-weight="900" fill="#2f2b23" letter-spacing="-1.4">기록 타일</text>';
s+='<text x="397" y="124" text-anchor="middle" font-family="Gothic A1,sans-serif" font-size="14" font-weight="500" fill="#807a68" letter-spacing="1">환경아카이브 풀숲 · 사건 기록 45건으로 하는 주제 맞히기</text>';
s+='<g stroke="#ddd2b8" stroke-width="2" stroke-linecap="round"><path d="M250 86h-38M250 104h-30"/><path d="M544 86h38M544 104h30"/></g>';

/* ── 한 문장 규칙 띠 ── */
s+='<rect x="52" y="152" width="690" height="46" rx="23" fill="#2f2b23"/>';
s+='<text x="397" y="181" text-anchor="middle" font-family="Gothic A1,sans-serif" font-size="17" font-weight="700" fill="#faf5ea">카드를 뒤집어 어느 주제인지 맞히고, 그 타일 위에 올립니다.</text>';

/* ── 주제 타일 3×3 ── */
const x0=52,y0=222,tw=218,th=196,gx=18,gy=18;
SUBJ.forEach((k,i)=>{
  const c=i%3,r=Math.floor(i/3),x=x0+c*(tw+gx),y=y0+r*(th+gy),cx=x+tw/2;
  s+='<g>';
  s+='<rect x="'+x+'" y="'+y+'" width="'+tw+'" height="'+th+'" rx="20" fill="'+TINT[k]+'" stroke="'+CORE[k]+'" stroke-width="1.8" stroke-opacity=".45"/>';
  s+='<rect x="'+(x+10)+'" y="'+(y+10)+'" width="'+(tw-20)+'" height="'+(th-20)+'" rx="13" fill="none" stroke="'+CORE[k]+'" stroke-width="1" stroke-opacity=".2" stroke-dasharray="5 5"/>';
  s+='<g transform="translate('+(cx-24)+','+(y+26)+') scale(2)" fill="none" stroke="'+CORE[k]+'" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+ICON[k]+'</g>';
  s+='<text x="'+cx+'" y="'+(y+126)+'" text-anchor="middle" font-family="Gothic A1,sans-serif" font-size="21" font-weight="800" fill="#2f2b23">'+esc(k)+'</text>';
  s+='<text x="'+cx+'" y="'+(y+146)+'" text-anchor="middle" font-family="Gothic A1,sans-serif" font-size="9.5" font-weight="700" fill="'+CORE[k]+'" fill-opacity=".8" letter-spacing="1.4">'+ROMA[k]+'</text>';
  s+='<rect x="'+(cx-40)+'" y="'+(y+158)+'" width="80" height="24" rx="12" fill="#fffdf7" stroke="'+CORE[k]+'" stroke-width="1.3"/>';
  s+='<text x="'+cx+'" y="'+(y+175)+'" text-anchor="middle" font-family="Gothic A1,sans-serif" font-size="13" font-weight="800" fill="'+CORE[k]+'">카드 '+CNT[k]+'장</text>';
  s+='</g>';
});

/* ── 카드 자리 ── */
const zone=(x,y,w,h,no,label,sub)=>'<g>'+
  '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="14" fill="#f3ecdc" stroke="#b9ad91" stroke-width="1.6" stroke-dasharray="8 6"/>'+
  '<circle cx="'+(x+30)+'" cy="'+(y+h/2)+'" r="15" fill="#2f2b23"/>'+
  '<text x="'+(x+30)+'" y="'+(y+h/2+6)+'" text-anchor="middle" font-family="Gothic A1,sans-serif" font-size="17" font-weight="800" fill="#faf5ea">'+no+'</text>'+
  '<text x="'+(x+58)+'" y="'+(y+h/2-4)+'" font-family="Gothic A1,sans-serif" font-size="17" font-weight="800" fill="#2f2b23">'+label+'</text>'+
  '<text x="'+(x+58)+'" y="'+(y+h/2+16)+'" font-family="Gothic A1,sans-serif" font-size="12" font-weight="500" fill="#807a68">'+sub+'</text></g>';
s+=zone(52,852,336,86,"1","뽑을 카드","45장을 섞어 뒷면으로 쌓습니다");
s+=zone(406,852,336,86,"2","가져간 카드","맞힌 사람이 여기에 쌓습니다");

/* ── 규칙 ── */
s+='<text x="52" y="978" font-family="Gothic A1,sans-serif" font-size="11" font-weight="800" fill="#807a68" letter-spacing="2.2">규칙</text>';
s+='<line x1="92" y1="974" x2="742" y2="974" stroke="#ddd2b8" stroke-width="1.2"/>';
const rules=[
 "차례가 되면 ① 에서 맨 위 카드를 뒤집어 모두에게 보입니다.",
 "어느 주제인지 말하고 그 타일 위에 올립니다. 카드 뒷면의 주제와 맞으면 가져가 ② 에 쌓습니다.",
 "틀리면 카드를 타일에 그대로 두고, 다음 사람이 그 카드부터 다시 맞힙니다."
];
rules.forEach((t,i)=>{
  const y=1000+i*24;
  s+='<circle cx="60" cy="'+(y-5)+'" r="8.5" fill="none" stroke="#b9ad91" stroke-width="1.4"/>';
  s+='<text x="60" y="'+(y-1)+'" text-anchor="middle" font-family="Gothic A1,sans-serif" font-size="11" font-weight="800" fill="#6f6a5c">'+(i+1)+'</text>';
  s+='<text x="78" y="'+y+'" font-family="Gothic A1,sans-serif" font-size="16" font-weight="500" fill="#3a352c">'+esc(t)+'</text>';
});
s+='<rect x="52" y="1052" width="690" height="1.2" fill="#ddd2b8"/>';
s+='<text x="397" y="1072" text-anchor="middle" font-family="Gothic A1,sans-serif" font-size="16" font-weight="800" fill="#2f2b23">카드가 다 떨어지면 ② 에 카드가 가장 많은 사람이 이깁니다.</text>';

/* ── 출처 ── */
s+='<text x="397" y="1100" text-anchor="middle" font-family="Gothic A1,sans-serif" font-size="9.5" font-weight="500" fill="#9a9280" letter-spacing=".3">데이터: 재단법인 숲과나눔 환경아카이브 풀숲 · 풀숲 데이터 랩 (CC BY 4.0)</text>';

document.querySelector(".board").innerHTML=s;
</script>
